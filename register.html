<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar - ayam.id</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div class="container-fluid">
    <div class="row" style="min-height: 100vh;">
      <div class="col-lg-6 bg-primary text-white d-flex align-items-center justify-content-center p-5">
        <div class="text-center">
          <h1 class="display-3 fw-bold mb-4">ayam.id</h1>
          <p class="lead mb-4">Bergabunglah dengan ribuan pelanggan yang puas</p>
          <div class="row text-center mt-5">
            <div class="col">
              <h2 class="fw-bold">10K+</h2>
              <p>Produk Tersedia</p>
            </div>
            <div class="col">
              <h2 class="fw-bold">50K+</h2>
              <p>Pelanggan</p>
            </div>
            <div class="col">
              <h2 class="fw-bold">4.9</h2>
              <p>Rating</p>
            </div>
          </div>
        </div>
      </div>

      <div class="col-lg-6 d-flex align-items-center justify-content-center p-5">
        <div style="max-width: 500px; width: 100%;">
          <div class="mb-4">
            <h2 class="fw-bold mb-2">Buat Akun Baru</h2>
            <p class="text-muted">Isi data di bawah untuk mendaftar</p>
          </div>

          <form>
            <div class="mb-3">
              <label class="form-label">Nama Lengkap</label>
              <input type="text" class="form-control" placeholder="Masukkan nama lengkap">
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" placeholder="nama@email.com">
            </div>
            <div class="mb-3">
              <label class="form-label">Nomor HP</label>
              <input type="tel" class="form-control" placeholder="08xx xxxx xxxx">
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" class="form-control" placeholder="Minimal 8 karakter">
            </div>
            <div class="mb-3">
              <label class="form-label">Konfirmasi Password</label>
              <input type="password" class="form-control" placeholder="Ketik ulang password">
            </div>
            <div class="mb-3 form-check">
              <input type="checkbox" class="form-check-input" id="terms">
              <label class="form-check-label" for="terms">
                Saya setuju dengan <a href="terms.html">Syarat & Ketentuan</a>
              </label>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">Daftar</button>
          </form>

          <div class="text-center">
            <p class="text-muted">Sudah punya akun? <a href="login.html">Masuk di sini</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
